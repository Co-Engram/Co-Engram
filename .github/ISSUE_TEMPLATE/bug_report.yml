name: Bug Report
description: Report a bug to help us improve Co-Engram
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `...`
        2. Call `engram_create` with `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages / stack traces if available.
      render: shell
    validations:
      required: true

  - type: input
    id: co-engram-version
    attributes:
      label: Co-Engram version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22.x"
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code (MCP)
        - OpenClaw (plugin)
        - Custom (embedded @co-engram/core)
        - Other
    validations:
      required: true

  - type: input
    id: data-size
    attributes:
      label: Data repo size (optional)
      description: Run `find ~/team-memory/engrams -type f | wc -l` and paste the count.
      placeholder: "e.g. 42"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Output of `co-engram-mcp` run in foreground, or `[maintenance]` log lines.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting, you agree to follow our [Code of Conduct](../CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
